apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: observability-lab
  labels: { app: user-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user
          image: observability-lab/user:latest
          ports: [{ containerPort: 8081 }]
          env:
            - { name: PORT, value: "8081" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "otel-collector:4318" }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: observability-lab
spec:
  selector: { app: user-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: observability-lab
  labels: { app: order-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order
          image: observability-lab/order:latest
          ports: [{ containerPort: 8082 }]
          env:
            - { name: PORT, value: "8082" }
            - { name: PAYMENT_SERVICE_URL, value: "http://payment-service:8083" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "otel-collector:4318" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: observability-lab
spec:
  selector: { app: order-service }
  ports: [{ port: 8082, targetPort: 8082 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: observability-lab
  labels: { app: payment-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment
          image: observability-lab/payment:latest
          ports: [{ containerPort: 8083 }]
          env:
            - { name: PORT, value: "8083" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "otel-collector:4318" }
            - { name: FAULT_DELAY_MS, value: "0" }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: observability-lab
spec:
  selector: { app: payment-service }
  ports: [{ port: 8083, targetPort: 8083 }]
