apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: observability-lab
  labels: { app: api-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: gateway
          image: observability-lab/gateway:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: USER_SERVICE_URL, value: "http://user-service:8081" }
            - { name: ORDER_SERVICE_URL, value: "http://order-service:8082" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "otel-collector:4318" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: observability-lab
spec:
  selector: { app: api-gateway }
  ports: [{ port: 80, targetPort: 8080 }]
