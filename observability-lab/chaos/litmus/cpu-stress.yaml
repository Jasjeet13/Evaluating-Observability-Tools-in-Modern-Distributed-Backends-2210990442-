# S4 — CPU saturation on order-service (LitmusChaos 3.x style experiment manifest)
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: order-cpu-stress
  namespace: observability-lab
spec:
  appinfo:
    appns: observability-lab
    applabel: app=order-service
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-cpu-hog
      spec:
        components:
          env:
            - name: CPU_CORES
              value: "1"
            - name: CPU_LOAD
              value: "80"
            - name: TOTAL_CHAOS_DURATION
              value: "300"
